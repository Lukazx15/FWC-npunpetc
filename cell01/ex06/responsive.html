<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Responsive</title>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            border: 1px solid black;
            width: 50%;
            padding: 15px;
            box-sizing: border-box;
            word-break: break-word;
        }

        .first {
            background-color: #b5c378;
        }

        .second {
            background-color: #f7bfa6;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="first">First cell</td>
            <td class="second">Second cell</td>
        </tr>
    </table>

</body>
</html>
